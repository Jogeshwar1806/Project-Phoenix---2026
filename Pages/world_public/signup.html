<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Project Phoenix</title>
    <style>
      .center {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      .card {
        border: 1px solid black;
        padding: 2rem;
        border-radius: 1rem;
        margin-bottom: 2rem;
      }
    </style>
</head>
<body>
  <div class="center card">
    <form action="/HTMLnCSSTemplates/Pages/world_public/landing.html">
      <button type="submit">Home
      </button>
    </form>
    <form action="/HTMLnCSSTemplates/Pages/world_private/dashboard.html">
      <p>User Name</p>
      <input type="text" placeholder="User Name">
      <p>Email</p>
      <input type="email" placeholder="Email">
      <p>Password</p>
      <input type="password" placeholder="password">
      <p>Re-Enter Password</p>
      <input type="password" placeholder="Re-Enter Password">
      <br>
      <br>
      <br>
      <button>Sign Up</button>
    </form>
    <p>Already Have an Account ?</p>
    <form action="/HTMLnCSSTemplates/Pages/world_public/login.html">
      <button>Log In</button>
    </form>
    </div>
</body>
</html>
