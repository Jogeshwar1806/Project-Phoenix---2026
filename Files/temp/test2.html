<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sidebar ON/OFF</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    background: #f4f4f4;
    height: 100vh;
  }

  /* Hidden checkbox */
  #toggle {
    display: none;
  }

  /* Open Button */
  .open-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #333;
    color: #fff;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    z-index: 1001;
  }

  /* Sidebar */
  .sidebar {
    position: fixed;
    top: 0;
    left: -260px;
    width: 260px;
    height: 100%;
    background: #333;
    color: #fff;
    padding-top: 60px;
    transition: 0.4s ease;
    z-index: 1000;
  }

  /* Close Button */
  .close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 22px;
    cursor: pointer;
  }

  .sidebar ul {
    list-style: none;
    margin-top: 20px;
  }

  .sidebar ul li {
    padding: 15px 25px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .sidebar ul li:hover {
    background: #444;
    cursor: pointer;
  }

  /* Show Sidebar when checked */
  #toggle:checked ~ .sidebar {
    left: 0;
  }

  /* Hide Open button when sidebar is open */
  #toggle:checked ~ .open-btn {
    display: none;
  }

  /* Content */
  .content {
    padding: 100px 40px;
  }
</style>
</head>
<body>

<input type="checkbox" id="toggle">

<!-- Open Button -->
<label for="toggle" class="open-btn">☰ Menu</label>

<!-- Sidebar -->
<div class="sidebar">
  <!-- Close Button -->
  <label for="toggle" class="close-btn">✖</label>

  <ul>
    <li>Dashboard</li>
    <li>Profile</li>
    <li>Projects</li>
    <li>Settings</li>
    <li>Logout</li>
  </ul>
</div>

<div class="content">
  <h1>Main Content</h1>
  <p>Click ☰ Menu to open and ✖ to close the sidebar.</p>
</div>

<a href="/HTMLnCSSTemplates/Pages/world_private/dashboard.html">gogogogo</a>

</body>
</html>
